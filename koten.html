<div class="card">
    <h2>{{ q.word }}</h2>

    {% if q.example %}
    <p class="example">例：{{ q.example }}</p>
    {% endif %}

    <form action="/quiz" method="post">
        <input type="hidden" name="word" value="{{ q.word }}">
        <input type="hidden" name="time" id="time_input" value="0">

        <div class="choices">
            {% for c in choices %}
            <button type="submit" name="answer" value="{{ c }}" class="choice-btn">
                {{ c }}
            </button>
            {% endfor %}
        </div>
    </form>
</div>
