<h1>🗑 単語を削除</h1>

<form method="POST">
    <select name="word">
        {% for w in words %}
            <option value="{{ w.word }}">{{ w.word }} - {{ w.meaning }}</option>
        {% endfor %}
    </select>
    <button type="submit">削除</button>
</form>
