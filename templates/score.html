<h2>成績一覧</h2>       
<a href="/" class="home-btn">🏠 ホームに戻る</a>

<table border="1" cellpadding="8">
    <tr>
        <th>日時</th>
        <th>スコア</th>
        <th>タイム</th>   <!-- ★ 追加 -->
        <th>間違えた単語</th>
    </tr>

    {% for s in scores %}
    <tr>
        <td>{{ s.date }}</td>
        <td>{{ s.correct }}/{{ s.total }}</td>

        <!-- ★ タイム表示（分:秒） -->
        <td>{{ s.time }}</td>

        <td>
            {% if s.wrong_list %}
                {% for w in s.wrong_list %}
                    {{ w.word }}（{{ w.meaning }}）<br>
                {% endfor %}
            {% else %}
                なし
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>
