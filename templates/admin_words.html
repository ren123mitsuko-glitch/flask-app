<h1>📚 単語リスト</h1>

<link rel="stylesheet" href="/static/style.css">


<input id="searchBox" type="text" placeholder="単語・意味で検索" style="
    width: 100%;
    padding: 12px;
    font-size: 18px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid #ccc;
">

<div id="wordList" class="admin-list">
    {% for w in words %}
        <div class="admin-item word-row">
            <b class="word">{{ w.word }}</b> - 
            <span class="meaning">{{ w.meaning }}</span>
            <span class="range">({{ w.range }})</span>
        </div>
    {% endfor %}
</div>

<a class="home-btn" href="/admin">← 管理メニューへ戻る</a>

<script>
document.getElementById("searchBox").addEventListener("input", function() {
    const keyword = this.value.toLowerCase();
    const rows = document.querySelectorAll(".word-row");

    rows.forEach(row => {
        const word = row.querySelector(".word").textContent.toLowerCase();
        const meaning = row.querySelector(".meaning").textContent.toLowerCase();

        if (word.includes(keyword) || meaning.includes(keyword)) {
            row.style.display = "block";
        } else {
            row.style.display = "none";
        }
    });
});
</script>
