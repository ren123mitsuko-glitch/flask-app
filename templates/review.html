<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Review</title>
    <style>
        .choice-card {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 15px;
            font-size: 20px;
            border-radius: 10px;
            background: #f0f0f0;
            border: none;
        }
    </style>
</head>

<body>

<div id="popup" style="
    display:none;
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    padding:20px;
    color:white;
    font-size:20px;
    border-radius:10px;
    z-index:999;
    max-width: 90%;
"></div>

<h1>復習モード</h1>

<h2>{{ q.word }}</h2>

<form id="answerForm" action="/review_answer" method="post">
    <input type="hidden" name="correct" value="{{ q.word }}">
    <input type="hidden" name="chosen" id="chosen">
</form>

{% for c in choices %}
<button class="choice-card" onclick="
    document.getElementById('chosen').value='{{ c }}';
    checkReviewAnswer(
        '{{ q.word }}',
        '{{ c }}',
        '{{ q.meaning }}',
        '{{ q.example }}'
    );
">
    {{ c }}
</button>
{% endfor %}

<script>
function checkReviewAnswer(correct, chosen, meaning, example) {
    const box = document.getElementById("popup");

    if (correct === chosen) {
        box.innerHTML = "正解！";
        box.style.background = "#4CAF50";
    } else {
        box.innerHTML = `
            <div style="font-size:22px; font-weight:bold;">不正解…</div>
            <div style="margin-top:8px;">
                <b>意味：</b> ${meaning}<br>
                ${example ? `<b>例文：</b> ${example}` : ""}
            </div>
        `;
        box.style.background = "#E53935";
    }

    box.style.display = "block";

    setTimeout(() => {
        document.getElementById("answerForm").submit();
    }, 800);
}
</script>

</body>
</html>
